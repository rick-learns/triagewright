# Model prices in USD per million tokens. Owned by lane E (observability).
# Every entry needs a `source` (URL + date checked). Unknown models are an error,
# never a guessed price. Replay responses are priced under the provider that
# recorded them; a `provider = "replay"` lookup falls back to gemini, then openrouter.
#
# Fields: provider, model, input_per_mtok_usd, output_per_mtok_usd,
# cache_read_per_mtok_usd (default 0), cache_write_per_mtok_usd (default 0), source.

# ---- Gemini API free tier (the key's project has no billing linked) ----

[[model]]
provider = "gemini"
model = "gemini-3.5-flash-lite"
input_per_mtok_usd = 0.0
output_per_mtok_usd = 0.0
source = "https://ai.google.dev/gemini-api/docs/pricing (free tier), checked 2026-11-19"

# Second free Flash-Lite. Free-tier quota is per model, so live runs can use it
# (TW_MODEL_*) while the default's daily quota is spent.
[[model]]
provider = "gemini"
model = "gemini-3.1-flash-lite"
input_per_mtok_usd = 0.0
output_per_mtok_usd = 0.0
source = "https://ai.google.dev/gemini-api/docs/pricing (free tier), checked 2026-11-19"

