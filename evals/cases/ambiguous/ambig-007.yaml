title: Mixed intents, order status plus a double charge -> escalated to billing
ticket:
  ticket_id: tkt_ambig007
  customer_id: cus_gus07
  channel: email
  subject: Chair order and two charges
  body: >-
    Where is my desk chair (ord_g7001)? Also, my bank statement shows two
    charges of $249.00 for that same order. I only ordered one chair.
  created_at: "2026-06-15T09:30:00Z"
expected:
