id: happy-007
category: happy_path
title: Anonymous return-policy question is answered from the KB, no account needed
ticket:
  ticket_id: tkt_happy007
  channel: web
  subject: Return window
  body: >-
    How many days do I have to return an item, and do I have to pay for the
    return shipping?
  created_at: "2026-06-15T06:30:00Z"
expected:
  status_any: [resolved]
  escalate: false
  must_call: [search_kb]
  citations_any: [kb_returns]
  reply_includes_any: ["30 days", "30-day", "thirty days"]
tags: [policy_question, returns, citation, anonymous]
notes: >-
  The ticket has no customer_id, but a general policy question needs no
  account or order data, and search_kb is unscoped. So this isn't the
  "no customer_id -> needs_info" row (compare ambig-002). kb_returns: return
  within 30 days of delivery; we email a prepaid shipping label, so the
  customer doesn't pay for return shipping.
