notes: >-
  Boundary for the window. The world override adds ord_l1203 for cus_lea12 (active, no refunds),
  delivered exactly 30 days before as_of. window_ends_at = 2026-06-15T12:00:00Z = as_of, and
  outside_window fails only when as_of > window_ends_at, so it has no reason and goes to approval.
  Compare policy-010.
