repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: export-schemas-check
        name: check exported JSON schemas
        entry: uv run python scripts/export_schemas.py --check
        language: system
        pass_filenames: false
        files: ^(src/triagewright/contracts/|scripts/export_schemas\.py|schemas/)
