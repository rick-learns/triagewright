[project]
name = "triagewright"
version = "0.1.0"
description = "Local-first AI customer-support resolution agent: triage, MCP tools, RAG, guardrails, evals."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "mcp>=1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.13",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
local-embeddings = ["fastembed>=0.4"]

[project.scripts]
triagewright = "triagewright.cli:main"
triagewright-api = "triagewright.api:main"
triagewright-mcp = "triagewright.mcp_server:main"
triagewright-evals = "triagewright.evals:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagewright"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "ASYNC"]
ignore = ["S101", "PT018", "RUF012"]  # RUF012: pydantic copies mutable defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that start the MCP server or other local processes",
    "live: tests that call a real model provider (never run in CI)",
]

[tool.coverage.run]
source = ["triagewright"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
